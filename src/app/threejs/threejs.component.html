  <!-- ========== HERO SECTION — Ali-style Parallax + Spaceman ========== -->
<section class="hero-section" id="home">

  <!-- Parallax Background Layers -->
  <div class="parallax-bg">
    <!-- Sky -->
    <div class="parallax-layer sky-layer"></div>
    <!-- Mountain 3 (farthest) -->
    <div class="parallax-layer mountain3-layer" [style.transform]="'translateY(' + mountain3Y + ')'"></div>
    <!-- Planets -->
    <div class="parallax-layer planets-layer" [style.transform]="'translateX(' + planetsX + ')'"></div>
    <!-- Mountain 2 -->
    <div class="parallax-layer mountain2-layer" [style.transform]="'translateY(' + mountain2Y + ')'"></div>
    <!-- Mountain 1 (closest) -->
    <div class="parallax-layer mountain1-layer" [style.transform]="'translateY(' + mountain1Y + ')'"></div>
    <!-- Dark overlay -->
    <div class="parallax-overlay"></div>
  </div>

  <!-- Hero Text Content -->
  <div class="hero-text-content">
    <div class="hero-text-inner">
      <p class="hero-greeting animate-slide-in" style="animation-delay: 0.8s">Samir K.C.</p>
      <div class="hero-subtitle-block">
        <div class="flip-word-wrapper animate-slide-in" style="animation-delay: 1s">
          <span class="flip-word" [class.flip-in]="isFlipAnimating" [class.flip-out]="!isFlipAnimating">
            {{currentFlipWord}}
          </span>
        </div>
        <p class="hero-subtitle animate-slide-in" style="animation-delay: 1.3s">
          backend systems &amp; distributed architecture
        </p>
      </div>
    </div>
  </div>

  <!-- 3D Spaceman Canvas (fullscreen overlay like Ali's) -->
  <div class="spaceman-canvas-wrapper">
    <canvas id="astronautCanvas"></canvas>
  </div>

</section>

<!-- ========== ABOUT ========== -->
<section id="about">
  <app-about></app-about>
</section>

<!-- ========== EXPERIENCE ========== -->
<section id="experience">
  <div class="experience-section">
    <div class="section-header">
      <span class="section-label"><span class="label-num">03</span> Experience</span>
      <h2 class="section-title">Where I've Worked</h2>
      <div class="title-line"></div>
    </div>

    <div class="timeline">
      <div class="timeline-item" *ngFor="let exp of experiences; let i = index"
           [class.visible]="exp.visible">
        <div class="timeline-marker">
          <div class="marker-dot"></div>
          <div class="marker-line" *ngIf="i < experiences.length - 1"></div>
        </div>
        <div class="timeline-content">
          <div class="exp-header">
            <div>
              <h3 class="exp-role">{{exp.role}}</h3>
              <span class="exp-company">
                <i class="fas fa-building"></i> {{exp.company}}
              </span>
            </div>
            <span class="exp-date">
              <i class="fas fa-calendar-alt"></i> {{exp.date}}
            </span>
          </div>
          <ul class="exp-points">
            <li *ngFor="let point of exp.points">
              <i class="fas fa-caret-right"></i>
              <span>{{point}}</span>
            </li>
          </ul>
          <div class="exp-tech">
            <span *ngFor="let tech of exp.tech" class="tech-pill">{{tech}}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ========== PROJECTS ========== -->
<section id="projects">
  <app-projects></app-projects>
</section>

<!-- ========== CONTACT ========== -->
<section id="contact">
  <app-contact></app-contact>
</section>
