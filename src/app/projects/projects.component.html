<section class="projects-section">
  <div class="section-header">
    <span class="section-label"><span class="label-num">04.</span> Projects</span>
    <h2 class="section-title">Things I've Built</h2>
    <div class="title-line"></div>
  </div>

  <!-- Featured Projects -->
  <div class="featured-projects">
    <div class="featured-project" *ngFor="let project of projects; let i = index; let even = even"
         [class.reverse]="!even">
      <div class="project-image">
        <div class="image-overlay"></div>
        <img [src]="project.image" [alt]="project.title">
      </div>
      <div class="project-info" [class.align-right]="even" [class.align-left]="!even">
        <span class="project-overline">Featured Project</span>
        <h3 class="project-title">{{project.title}}</h3>
        <div class="project-desc">
          <p>{{project.description}}</p>
        </div>
        <div class="project-tech">
          <span *ngFor="let tech of project.technologies">{{tech}}</span>
        </div>
        <div class="project-links">
          <a [href]="project.github" target="_blank" class="project-link" title="View Source">
            <i class="fab fa-github"></i>
          </a>
          <a *ngIf="project.live" [href]="project.live" target="_blank" class="project-link" title="Live Demo">
            <i class="fas fa-external-link-alt"></i>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
