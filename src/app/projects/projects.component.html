<div class="container">
  <h2 class="container text-center ">My Projects</h2>
<div *ngFor="let project of projects">

  <mat-card class="example-card" appearance="outlined">
    <mat-card-header>
      <mat-card-title-group>
        <mat-card-title>{{ project.title }}</mat-card-title>
        <img mat-card-sm-image src="{{project.image}}" >

      </mat-card-title-group>



    </mat-card-header>
    <mat-card-content>{{project.description}}</mat-card-content>
<span *ngFor="let tech of project.technologies">

  <img
    [src]="getBadgeUrl(tech)"
   [alt]="tech"
    class="tech-badge"
  />

</span>
    <div class="link">
      <a [href]="project.github" target="_blank"><i class="fab fa-github "> GitHub</i></a>
    </div>
  </mat-card>

</div>

</div>
