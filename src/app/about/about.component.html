<section class="about-section" id="about">

  <!-- Section Header -->
  <div class="section-header">
    <span class="section-label"><span class="label-num">02</span> About</span>
    <h2 class="section-title">Developer workspace</h2>
    <div class="title-line"></div>
  </div>

  <!-- 2-Column Layout: Terminal + 3D -->
  <div class="about-row">

    <!-- LEFT — Terminal -->
    <div class="about-col-left">
      <div class="terminal">

        <!-- Title bar -->
        <div class="term-bar">
          <div class="term-dots">
            <span class="dot dot-r"></span>
            <span class="dot dot-y"></span>
            <span class="dot dot-g"></span>
          </div>
          <span class="term-title">samir&#64;dev — zsh</span>
          <div class="term-actions">
            <i class="fas fa-minus"></i>
            <i class="fas fa-expand"></i>
          </div>
        </div>

        <!-- Terminal body -->
        <div class="term-body">

          <!-- Login banner -->
          <div class="term-line term-banner">Last login: {{ currentDate }} on ttys001</div>

          <ng-container *ngFor="let entry of terminalEntries; let i = index">

            <!-- Command -->
            <div class="term-line" *ngIf="entry.type === 'command'">
              <span class="ps1">
                <span class="ps1-user">samir</span><span class="ps1-at">&#64;</span><span class="ps1-host">dev</span>
                <span class="ps1-sep">:</span><span class="ps1-path">~</span><span class="ps1-dollar">$</span>
              </span>
              <span class="cmd" *ngIf="entry.isTyping">{{ entry.typedText }}<span class="inline-cursor">▌</span></span>
              <span class="cmd" *ngIf="!entry.isTyping">{{ entry.text }}</span>
            </div>

            <!-- Output -->
            <div class="term-line" *ngIf="entry.type === 'output'"
                 [ngClass]="entry.class || ''">{{ entry.text }}</div>

          </ng-container>

          <!-- Idle cursor -->
          <div class="term-line cursor-idle">
            <span class="ps1">
              <span class="ps1-user">samir</span><span class="ps1-at">&#64;</span><span class="ps1-host">dev</span>
              <span class="ps1-sep">:</span><span class="ps1-path">~</span><span class="ps1-dollar">$</span>
            </span>
            <span class="block-cursor">▌</span>
          </div>
        </div>

      </div>

      <!-- Status bar below terminal -->
      <div class="term-status">
        <span class="status-dot"></span>
        <span>System online — all services running</span>
      </div>
    </div>

    <!-- RIGHT — 3D Programmer Desktop -->
    <div class="about-col-right">
      <div class="model-wrapper">
        <canvas #modelCanvas class="model-canvas"></canvas>
      </div>
    </div>

  </div>

  <!-- Tech Stack -->
  <div class="tech-section">
    <h3 class="tech-heading">
      <span class="bracket">&lt;</span>Tech Stack<span class="bracket"> /&gt;</span>
    </h3>

    <div class="tech-grid">
      <div class="tech-category" *ngFor="let cat of techStack; let i = index"
           [style.animation-delay]="(i * 0.08) + 's'">
        <div class="cat-header">
          <i class="fas" [ngClass]="cat.icon"></i>
          <h4>{{ cat.name }}</h4>
        </div>
        <div class="cat-items">
          <span class="tag" *ngFor="let t of cat.items">{{ t }}</span>
        </div>
      </div>
    </div>
  </div>

</section>
