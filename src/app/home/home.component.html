<nav class="navbar" [class.scrolled]="isScrolled" id="mainNav">
  <div class="scroll-progress-bar" [style.width.%]="scrollProgress"></div>
  <div class="nav-container">
    <a class="nav-logo" (click)="scrollTo('home')">
      <span class="logo-text">SK</span>
      <span class="logo-dot">.</span>
    </a>

    <button class="nav-toggle" (click)="toggleMobileMenu()" [class.active]="mobileMenuOpen">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <ul class="nav-links" [class.mobile-open]="mobileMenuOpen">
      <li *ngFor="let item of navItems; let i = index">
        <a (click)="scrollTo(item.id)"
           [class.active]="activeSection === item.id">
          <span class="nav-num">0{{i + 1}}.</span> {{item.label}}
        </a>
      </li>
      <li class="nav-resume">
        <a href="Resume.pdf" target="_blank" class="resume-btn">
          <i class="fas fa-download"></i> Resume
        </a>
      </li>
    </ul>
  </div>
</nav>
